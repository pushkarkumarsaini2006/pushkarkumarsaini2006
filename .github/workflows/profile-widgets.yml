name: Update profile widgets

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate plain SVG widgets
        run: node .github/scripts/generate-profile-widgets.mjs

      - name: Commit updated widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.svg
          git diff --cached --quiet || git commit -m "Update profile widgets [skip ci]"
          git push